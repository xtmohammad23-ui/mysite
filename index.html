<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>PHOENIX TERMINAL OS</title>
    <style>
        body { 
            background: #000; 
            color: #00ff41; 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            padding: 20px;
            overflow-x: hidden;
        }

        /* افکت ماتریکس در پس‌زمینه */
        body::before {
            content: "PHOENIX 010101 DRAGON 101010";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.05;
            font-size: 20px;
            line-height: 25px;
            word-wrap: break-word;
            z-index: -1;
            animation: matrix 10s linear infinite;
        }

        @keyframes matrix { from { top: 0; } to { top: -100px; } }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .window {
            border: 1px solid #00ff41;
            background: rgba(0, 20, 0, 0.9);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        .header {
            background: #00ff41;
            color: black;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .content { padding: 15px; }

        .dragon-img {
            width: 100%;
            border: 1px solid #00ff41;
            position: relative;
        }

        /* خط اسکن روی اژدها */
        .scanline {
            width: 100%;
            height: 2px;
            background: #00ff41;
            position: absolute;
            top: 0;
            box-shadow: 0 0 10px #00ff41;
            animation: scan 3s linear infinite;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .stat-bar { background: #111; height: 10px; border: 1px solid #00ff41; margin: 10px 0; }
        .fill { background: #00ff41; height: 100%; width: 85%; animation: pulse 2s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<h1 style="text-align:center; text-shadow: 0 0 10px #0f0;">SYSTEM PHOENIX ONLINE</h1>

<div class="dashboard">
    <div class="window">
        <div class="header"><span>DRAGON_CORE</span><span>[ACTIVE]</span></div>
        <div class="content" style="position:relative;">
            <div class="scanline"></div>
            <img class="dragon-img" src="Screenshot_2025-04-27-19-18-06-985_com.miui.mediaviewer.png">
        </div>
    </div>

    <div class="window">
        <div class="header"><span>SYSTEM_STATS</span><span>[OK]</span></div>
        <div class="content">
            <p>> قدرت اژدها: 100%</p>
            <div class="stat-bar"><div class="fill"></div></div>
            <p>> امنیت شبکه: نفوذناپذیر</p>
            <p>> مکان: GitHub Server</p>
        </div>
    </div>

    <div class="window">
        <div class="header"><span>COMMAND_LOG</span><span>[RUN]</span></div>
        <div class="content" style="font-size: 13px; color: #88ff88;">
            <p>> Initializing dragon_protocol...</p>
            <p>> Accessing firewall...</p>
            <p>> PHOENIX bypass successful.</p>
            <p>> Welcome, Master Mohammad.</p>
        </div>
    </div>
</div>

</body>
</html>
