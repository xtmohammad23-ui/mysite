<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>PHOENIX OS v3.0</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; margin: 0; padding: 10px; }
        .grid { display: flex; flex-direction: column; gap: 15px; }
        .window { border: 1px solid #0f0; background: rgba(0,20,0,0.8); border-radius: 5px; box-shadow: 0 0 10px #0f0; }
        .header { background: #0f0; color: #000; padding: 5px; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; }
        .content { padding: 10px; }
        img { width: 100%; border: 1px solid #0f0; }
        .loading-bar { width: 100%; height: 15px; border: 1px solid #0f0; position: relative; }
        .fill { height: 100%; background: #0f0; width: 70%; animation: load 3s infinite; }
        @keyframes load { 0% { width: 0%; } 50% { width: 100%; } 100% { width: 0%; } }
    </style>
</head>
<body>
    <h2 style="text-align:center; letter-spacing: 5px;">PHOENIX SYSTEM</h2>
    
    <div class="grid">
        <div class="window">
            <div class="header"><span>MAIN_CORE</span><span>[SCANNING]</span></div>
            <div class="content">
                <img src="Screenshot_2025-04-27-19-18-06-985_com.miui.mediaviewer.png">
            </div>
        </div>

        <div class="window">
            <div class="header"><span>SYSTEM_STATUS</span><span>[STABLE]</span></div>
            <div class="content">
                <p>> قدرت هسته: 100%</p>
                <div class="loading-bar"><div class="fill"></div></div>
                <p>> امنیت: نفوذناپذیر</p>
                <p style="color: yellow;">> هشدار: اژدها در حال نظارت است...</p>
            </div>
        </div>
    </div>
</body>
</html>
