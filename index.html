<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>PHOENIX TERMINAL OS</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; margin: 0; padding: 10px; overflow-x: hidden; transition: background 0.3s; }
        .grid { display: flex; flex-direction: column; gap: 15px; }
        .window { border: 1px solid #0f0; background: rgba(0,20,0,0.8); border-radius: 5px; box-shadow: 0 0 10px #0f0; position: relative; }
        .header { background: #0f0; color: #000; padding: 5px; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; }
        .content { padding: 10px; text-align: center; }
        
        /* افکت پارازیت روی عکس */
        img { width: 100%; border: 1px solid #0f0; animation: glitch 5s infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            1% { transform: translate(-5px, 2px); filter: hue-rotate(90deg); }
            2% { transform: translate(5px, -2px); filter: grayscale(1); }
            3% { transform: translate(0); filter: none; }
        }

        .loading-bar { width: 100%; height: 15px; border: 1px solid #0f0; margin-top: 10px; }
        .fill { height: 100%; background: #0f0; width: 0%; animation: load 4s infinite; }
        @keyframes load { 0% { width: 0%; } 50% { width: 100%; } 100% { width: 0%; } }

        /* دکمه حمله */
        .btn-attack { background: #f00; color: #fff; border: none; padding: 10px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .alarm { animation: flash 0.5s infinite; }
        @keyframes flash { 0% { background: #000; } 50% { background: #400; } 100% { background: #000; } }
    </style>
</head>
<body id="main-body">

    <h2 style="text-align:center; letter-spacing: 5px; margin-bottom: 5px;">PHOENIX SYSTEM</h2>
    <div id="clock" style="text-align:center; color: #0f0; margin-bottom: 15px; font-size: 20px;">00:00:00</div>
    
    <div class="grid">
        <div class="window">
            <div class="header"><span>MAIN_CORE</span><span>[ONLINE]</span></div>
            <div class="content">
                <img src="Screenshot_2025-04-27-19-18-06-985_com.miui.mediaviewer.png">
            </div>
        </div>

        <div class="window">
            <div class="header"><span>SYSTEM_INFO</span><span>[STABLE]</span></div>
            <div class="content">
                <p>> قدرت هسته: 100%</p>
                <div class="loading-bar"><div class="fill"></div></div>
                <p>> وضعیت: در حال نظارت...</p>
                <button class="btn-attack" onclick="startAlarm()">فعال‌سازی پروتکل حمله</button>
            </div>
        </div>
    </div>

    <script>
        // آپدیت ساعت
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + 
                                                        now.getMinutes().toString().padStart(2, '0') + ":" + 
                                                        now.getSeconds().toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000);

        // پروتکل حمله (هشدار)
        function startAlarm() {
            document.getElementById('main-body').classList.toggle('alarm');
            alert("پروتکل نفوذ توسط فینیکس فعال شد!");
        }
    </script>
</body>
</html>
