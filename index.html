<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>PHOENIX HACKER TERMINAL</title>
    <style>
        body {
            background-color: black;
            color: #00ff41; /* سبز هکری */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 5px #00ff41;
        }

        /* افکت باران ماتریکس در پس‌زمینه */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        .terminal-box {
            border: 2px solid #00ff41;
            padding: 20px;
            background: rgba(0, 20, 0, 0.8);
            box-shadow: 0 0 20px #00ff41;
            border-radius: 10px;
            max-width: 80%;
        }

        .dragon-img {
            width: 200px;
            filter: drop-shadow(0 0 10px #ff4d00);
            margin-bottom: 20px;
        }

        h1 { font-size: 2rem; border-left: 10px solid #00ff41; padding-left: 10px; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="terminal-box">
        <img src="https://raw.githubusercontent.com/xtmohammad23-ui/mysite/main/dragon.png" 
             onerror="this.src='https://i.pinimg.com/originals/f4/d2/94/f4d294020351368a5c378e932ba815d9.png'" 
             class="dragon-img">
        
        <h1>> ورود به شبکه فینیکس... <span class="cursor">_</span></h1>
        <p>وضعیت سیستم: <span style="color: white;">کاملاً امن (دائمی)</span></p>
        <p style="color: #4caf50;">[ دسترسی تایید شد ]</p>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px arial";
            drops.forEach((y, i) => {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
